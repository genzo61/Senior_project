services:
  garson-db:
    image: postgres:16-alpine
    container_name: garson-root-db
    environment:
      POSTGRES_DB: garson_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - garson_root_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garson_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  garson-backend:
    build:
      context: ./Garson_Backend
      dockerfile: Dockerfile
    image: garson-root-backend:local
    container_name: garson-root-backend
    depends_on:
      garson-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://garson-db:5432/garson_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL-nomic-embed-text}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS-8000}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE-0.0}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED-true}
      DAILY_SUMMARY_CRON: "${DAILY_SUMMARY_CRON-0 0 23 * * *}"
      SALES_ANALYSIS_CRON: "${SALES_ANALYSIS_CRON-0 5 23 * * *}"
      CUSTOMER_ENGAGEMENT_CRON: "${CUSTOMER_ENGAGEMENT_CRON-0 10 23 * * *}"
      RESTOCK_SUGGESTION_CRON: "${RESTOCK_SUGGESTION_CRON-0 15 23 * * *}"
      LOW_STOCK_THRESHOLD_DEFAULT: ${LOW_STOCK_THRESHOLD_DEFAULT-10}
      LOW_STOCK_ALERT_COOLDOWN_MINUTES: ${LOW_STOCK_ALERT_COOLDOWN_MINUTES-120}
      RESTOCK_SUGGESTION_DAYS: ${RESTOCK_SUGGESTION_DAYS-3}
      APP_TIMEZONE: ${APP_TIMEZONE-Europe/Istanbul}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID-}
      TELEGRAM_CONNECT_TIMEOUT_MS: ${TELEGRAM_CONNECT_TIMEOUT_MS-3000}
      TELEGRAM_READ_TIMEOUT_MS: ${TELEGRAM_READ_TIMEOUT_MS-3000}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES-2}
      TELEGRAM_RETRY_BACKOFF_MS: ${TELEGRAM_RETRY_BACKOFF_MS-750}
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  garson-customer-web:
    build:
      context: ./Garson_Customer_Frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL-}
        VITE_AI_CHAT_ENDPOINT: ${VITE_AI_CHAT_ENDPOINT-}
    image: garson-root-customer-web:local
    container_name: garson-root-customer-web
    depends_on:
      - garson-backend
    ports:
      - "5174:80"
    restart: unless-stopped

  garson-kitchen-web:
    build:
      context: ./Garson_Frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_KITCHEN_BACKEND_URL-}
    image: garson-root-kitchen-web:local
    container_name: garson-root-kitchen-web
    depends_on:
      - garson-backend
    ports:
      - "5175:80"
    restart: unless-stopped

volumes:
  garson_root_pg_data:
