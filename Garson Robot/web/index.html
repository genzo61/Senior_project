<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garson Robot</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
    <script type="text/javascript" src="/eel.js"></script>
    <script type="text/javascript" src="app.js" defer></script>
  </head>
  <body>
    <!-- ═══════════════════════════════════════════ -->
    <!--  EKRAN 1: DİL SEÇİMİ (HOME)                -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="home-screen" class="screen active">
      <div class="home-container">
        <div class="home-logo">
          <span class="material-symbols-rounded logo-icon">smart_toy</span>
          <h1>GARSON ROBOT</h1>
          <p class="home-sub">Lütfen dil seçiniz / Please select language</p>
        </div>
        <div class="lang-cards">
          <button class="lang-card lang-tr" onclick="selectLanguage('TR')">
            <span class="lang-flag">🇹🇷</span>
            <span class="lang-name">TÜRKÇE</span>
            <span class="lang-cta">Devam Et →</span>
          </button>
          <button class="lang-card lang-en" onclick="selectLanguage('EN')">
            <span class="lang-flag">🇬🇧</span>
            <span class="lang-name">ENGLISH</span>
            <span class="lang-cta">Continue →</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!--  EKRAN 2: ANA UYGULAMA                      -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="app-screen" class="screen">
      <!-- Sidebar -->
      <nav class="sidebar">
        <button
          class="sidebar-btn active"
          id="btn-home-nav"
          onclick="goHome()"
          title="Home"
        >
          <span class="material-symbols-rounded">home</span>
        </button>
        <button class="sidebar-btn" id="btn-menu-nav" title="Menu">
          <span class="material-symbols-rounded">restaurant_menu</span>
        </button>
        <div class="sidebar-spacer"></div>
        <button class="sidebar-btn" id="btn-settings-nav" title="Settings">
          <span class="material-symbols-rounded">settings</span>
        </button>
      </nav>

      <!-- Content Area -->
      <main class="content">
        <!-- Header -->
        <header class="content-header">
          <div class="header-text">
            <h2 id="header-title">Lezzet Dünyası</h2>
            <p id="header-sub">Bugün ne yemek istersiniz?</p>
          </div>
          <div id="status-badge" class="status-badge">
            <span class="material-symbols-rounded status-icon"
              >check_circle</span
            >
            <span id="status-text">Hazır</span>
          </div>
        </header>

        <!-- Menu Grid -->
        <div class="menu-scroll">
          <div id="menu-grid" class="menu-grid">
            <!-- Ürün kartları JS ile doldurulur -->
          </div>
        </div>
      </main>

      <!-- Cart Panel -->
      <aside class="cart-panel">
        <div class="cart-header">
          <span class="material-symbols-rounded cart-icon">receipt_long</span>
          <h3 id="cart-title">Sipariş Özeti</h3>
        </div>
        <div class="cart-table-info">
          <span class="material-symbols-rounded">table_restaurant</span>
          <span id="table-label">Masa No: 05</span>
        </div>
        <div class="cart-divider"></div>

        <div id="cart-items" class="cart-items">
          <!-- Sepet öğeleri JS ile doldurulur -->
          <div class="cart-empty-state" id="cart-empty">
            <span class="material-symbols-rounded">shopping_cart</span>
            <p>Sepetiniz boş</p>
          </div>
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            <span id="total-label">Toplam</span>
            <span id="total-amount" class="total-amount">0.00 TL</span>
          </div>

          <button id="btn-voice" class="btn-voice" onclick="startVoiceOrder()">
            <span class="material-symbols-rounded">mic</span>
            <span id="voice-btn-text">Sesle Analiz Et</span>
          </button>

          <button id="btn-checkout" class="btn-checkout" onclick="doCheckout()">
            <span class="material-symbols-rounded">credit_card</span>
            <span id="checkout-btn-text">Ödemeye Geç</span>
          </button>
        </div>
      </aside>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!--  TOAST NOTIFICATION                          -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="toast" class="toast hidden">
      <span class="material-symbols-rounded toast-icon">info</span>
      <span id="toast-msg"></span>
    </div>
  </body>
</html>
