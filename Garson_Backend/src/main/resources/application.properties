spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/garson_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8085

ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:8000}
ollama.temperature=${OLLAMA_TEMPERATURE:0.0}
chat.llm.enabled=${CHAT_LLM_ENABLED:true}
customer.ai.debug=${CUSTOMER_AI_DEBUG:false}
automation.enabled=${AUTOMATION_ENABLED:true}
automation.daily-summary-cron=${DAILY_SUMMARY_CRON:0 0 23 * * *}
automation.sales-analysis-cron=${SALES_ANALYSIS_CRON:0 5 23 * * *}
automation.customer-engagement-cron=${CUSTOMER_ENGAGEMENT_CRON:0 10 23 * * *}
automation.restock-suggestion-cron=${RESTOCK_SUGGESTION_CRON:0 15 23 * * *}
automation.low-stock-threshold-default=${LOW_STOCK_THRESHOLD_DEFAULT:10}
automation.low-stock-alert-cooldown-minutes=${LOW_STOCK_ALERT_COOLDOWN_MINUTES:120}
automation.restock-suggestion-days=${RESTOCK_SUGGESTION_DAYS:3}
app.timezone=${APP_TIMEZONE:Europe/Istanbul}

notification.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
notification.telegram.chat-id=${TELEGRAM_CHAT_ID:}
notification.telegram.connect-timeout-ms=${TELEGRAM_CONNECT_TIMEOUT_MS:3000}
notification.telegram.read-timeout-ms=${TELEGRAM_READ_TIMEOUT_MS:3000}
notification.telegram.max-retries=${TELEGRAM_MAX_RETRIES:2}
notification.telegram.retry-backoff-ms=${TELEGRAM_RETRY_BACKOFF_MS:750}
