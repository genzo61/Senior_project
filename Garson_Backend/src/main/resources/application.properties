spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/garson_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8085

ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:8000}
ollama.temperature=${OLLAMA_TEMPERATURE:0.0}
customer.ai.debug=${CUSTOMER_AI_DEBUG:false}
n8n.low-stock-webhook-url=${N8N_LOW_STOCK_WEBHOOK_URL:}
n8n.critical-error-webhook-url=${N8N_CRITICAL_ERROR_WEBHOOK_URL:}
low-stock-threshold-default=${LOW_STOCK_THRESHOLD_DEFAULT:5}
