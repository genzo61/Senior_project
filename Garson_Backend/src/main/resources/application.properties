spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/garson_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8085

ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:8000}
ollama.temperature=${OLLAMA_TEMPERATURE:0.0}
