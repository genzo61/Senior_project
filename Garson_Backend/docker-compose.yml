services:
  garson-db:
    image: postgres:16-alpine
    container_name: garson-backend-db
    environment:
      POSTGRES_DB: garson_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - garson_backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garson_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  garson-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: garson-backend:local
    container_name: garson-backend-api
    depends_on:
      garson-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://garson-db:5432/garson_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL-nomic-embed-text}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS-8000}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE-0.0}
      N8N_LOW_STOCK_WEBHOOK_URL: ${N8N_LOW_STOCK_WEBHOOK_URL-}
      N8N_CRITICAL_ERROR_WEBHOOK_URL: ${N8N_CRITICAL_ERROR_WEBHOOK_URL-}
      LOW_STOCK_THRESHOLD_DEFAULT: ${LOW_STOCK_THRESHOLD_DEFAULT-5}
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  garson_backend_pg_data:
